<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#232323" />
    <meta
      name="description"
      content="macterm — a fast, minimal macOS-style terminal for Windows: split panes, real ConPTY shells, a built-in code workspace, loopback-only host."
    />
    <link rel="icon" type="image/png" href="./favicon.png?v=2" />
    <title>macterm — terminal mac, tmux for windows</title>
    <script>
      try {
        var stored = localStorage.getItem('dashboard-theme');
        var resolved =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.classList.add(resolved);
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <style>
      html, body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
